<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Dairy Expense Tracker</title>

<link href="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.6.min.css" rel="stylesheet" type="text/css"/>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f9;
    padding:20px;
}

h1{
    text-align:center;
    color:#333;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

input,select,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    background:#2196F3;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}

.summary{
    margin-top:20px;
    background:#f0f0f0;
    padding:15px;
    border-radius:8px;
}

.summary p{
    font-size:18px;
    margin:8px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th,table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#2196F3;
    color:white;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn:hover{
    background:darkred;
}

.expense{
    color:red;
    font-weight:bold;
}

.modal {
    display: none;
    position: fixed;
    z-index: 10000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: white;
    padding: 20px 25px;
    border-radius: 8px;
    width: 90%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.modal-content p {
    margin-bottom: 20px;
    font-size: 16px;
    color: #333;
}
.modal-buttons {
    display: flex;
    gap: 10px;
}
.modal-buttons button {
    margin-top: 0;
}
.btn-cancel {
    background: #9e9e9e;
}
.btn-cancel:hover {
    background: #757575;
}
</style>

</head>
<body>

<h1>🐄 Personal Dairy Expense Tracker</h1>

<div class="container">

<h3>Add Expense</h3>

<input type="number" id="amount" placeholder="Enter Amount">

<select id="type">
<option value="Milk_expenses">Milk Expense</option>
<option value="Other_expense">Other Expense</option>
</select>

<input type="text" id="category" placeholder="Category (Milk, Biscuit, Tea, etc.)">

<!-- Modified input from date to text to support the custom calendar popup -->
<input type="text" id="date" placeholder="Select Nepali Date (B.S.)">

<button onclick="addTransaction()">Add Expense</button>

<div class="summary">
<p><strong>Milk Expenses:</strong> ₹ <span id="Milkexpenses">0</span></p>

<p><strong>Other Expenses:</strong> ₹ <span id="OtherExpense">0</span></p>

<p><strong>Total Expenses:</strong> ₹ <span id="balance">0</span></p>
</div>

<h3>Expense History</h3>

<table>

<thead>

<tr>

<th>Date (B.S.)</th>

<th>Category</th>

<th>Type</th>

<th>Amount</th>

<th>Action</th>

</tr>

</thead>

<tbody id="transactionTable">

</tbody>

</table>

</div>

<!-- Alert Modal -->
<div id="customAlertModal" class="modal">
    <div class="modal-content">
        <p id="alertMessageText"></p>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>

<!-- Confirm Modal -->
<div id="customConfirmModal" class="modal">
    <div class="modal-content">
        <p id="confirmMessageText"></p>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeConfirm(false)">Cancel</button>
            <button id="confirmYesBtn" onclick="closeConfirm(true)">Delete</button>
        </div>
    </div>
</div>

<script src="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.6.min.js" type="text/javascript"></script>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

// Helper to safely get the current Bikram Sambat date object
function getSafeCurrentBsDate() {
    if (typeof NepaliFunctions !== "undefined") {
        if (NepaliFunctions.BS && typeof NepaliFunctions.BS.GetCurrentDate === "function") {
            return NepaliFunctions.BS.GetCurrentDate();
        } else if (typeof NepaliFunctions.GetCurrentBsDate === "function") {
            return NepaliFunctions.GetCurrentBsDate();
        }
    }
    return null;
}

// Helper to format BS date object into standard YYYY-MM-DD template
function getSafeFormattedBsDate(bsDateObj) {
    if (!bsDateObj) return "";
    const year = bsDateObj.year;
    const month = String(bsDateObj.month).padStart(2, '0');
    const day = String(bsDateObj.day).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// Custom Non-blocking Alert & Confirm Replacements
function showAlert(msg) {
    document.getElementById("alertMessageText").innerText = msg;
    document.getElementById("customAlertModal").style.display = "flex";
}
function closeAlert() {
    document.getElementById("customAlertModal").style.display = "none";
}

let confirmCallback = null;
function showConfirm(msg, callback) {
    document.getElementById("confirmMessageText").innerText = msg;
    document.getElementById("customConfirmModal").style.display = "flex";
    confirmCallback = callback;
}
function closeConfirm(result) {
    document.getElementById("customConfirmModal").style.display = "none";
    if (result && confirmCallback) {
        confirmCallback();
    }
    confirmCallback = null;
}

// Initialize Calendar and Default Settings
window.onload = function() {
    const dateInput = document.getElementById("date");
    
    // Config parameters for Sajan Maharjan Datepicker
    const config = {
        ndpYear: true,
        ndpMonth: true,
        readOnlyInput: true
    };
    
    // Fallback checks for various library version names
    if (typeof dateInput.NepaliDatePicker === "function") {
        dateInput.NepaliDatePicker(config);
    } else if (typeof dateInput.nepaliDatePicker === "function") {
        dateInput.nepaliDatePicker(config);
    }

    // Default to the current B.S date
    const today = getSafeCurrentBsDate();
    if (today) {
        dateInput.value = getSafeFormattedBsDate(today);
    }
};

function addTransaction(){

    const amount=parseFloat(document.getElementById("amount").value);

    const type=document.getElementById("type").value;

    const category=document.getElementById("category").value.trim();

    // Fallback if the user cleared the date field
    const selectedDate = document.getElementById("date").value;
    let date = selectedDate;
    if (!date) {
        const today = getSafeCurrentBsDate();
        if (today) {
            date = getSafeFormattedBsDate(today);
        }
    }

    if(isNaN(amount) || amount<=0){
        showAlert("Please enter a valid amount.");
        return;
    }

    if(category===""){
        showAlert("Please enter a category.");
        return;
    }

    const transaction={
        amount,
        type,
        category,
        date
    };

    transactions.push(transaction);

    localStorage.setItem("transactions",JSON.stringify(transactions));

    document.getElementById("amount").value="";

    document.getElementById("category").value="";
    
    // Reset to today's date
    const today = getSafeCurrentBsDate();
    if (today) {
        document.getElementById("date").value = getSafeFormattedBsDate(today);
    } else {
        document.getElementById("date").value = "";
    }

    displayTransactions();

}

function deleteTransaction(index){
    showConfirm("Delete this expense?", function() {
        transactions.splice(index, 1);
        localStorage.setItem("transactions", JSON.stringify(transactions));
        displayTransactions();
    });
}

function displayTransactions(){

    const table=document.getElementById("transactionTable");

    table.innerHTML="";

    let Milkexpenses=0;

    let OtherExpense=0;

    transactions.forEach((t,index)=>{

        if(t.type==="Milk_expenses"){

            Milkexpenses+=t.amount;

        }else{

            OtherExpense+=t.amount;

        }

        table.innerHTML+=`

        <tr>

            <td>${t.date}</td>

            <td>${t.category}</td>

            <td class="expense">${t.type.replace("_"," ")}</td>

            <td>₹ ${t.amount.toFixed(2)}</td>

            <td>

                <button class="delete-btn" onclick="deleteTransaction(${index})">

                    Delete

                </button>

            </td>

        </tr>

        `;

    });

    document.getElementById("Milkexpenses").innerText=Milkexpenses.toFixed(2);

    document.getElementById("OtherExpense").innerText=OtherExpense.toFixed(2);

    document.getElementById("balance").innerText=(Milkexpenses+OtherExpense).toFixed(2);

}

displayTransactions();

</script>

</body>
</html>
